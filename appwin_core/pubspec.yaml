name: appwin_core
description: "Foundation of the Appwin Flutter SDKs: one configure, device identity, sign-in and sign-out, consent and the event stream shared by every Appwin product."
version: 1.1.0
homepage: https://appwin.io
repository: https://github.com/appwin-dev/appwin-flutter/tree/main/appwin_core
issue_tracker: https://github.com/appwin-dev/appwin-flutter/issues
topics:
  - appwin
  - sdk
  - identity
  - consent

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppwinCorePlugin
      android:
        package: io.appwin.flutter.core
        pluginClass: AppwinCorePlugin
