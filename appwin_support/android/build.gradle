// Android side of the `appwin_support` Flutter plugin.
//
// It compiles the glue **only**: the implementation lives in the AAR
// `io.appwin:appwin-support`, built by `sdk/android-build`. Exact counterpart
// of the iOS podspec (cf. ADR-0020).
group = "io.appwin.flutter.support"
version = "0.0.1"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Repositories declared for this module only: a plugin has no business
// rewriting the dependency resolution of the app that installs it.
repositories {
    google()
    mavenCentral()
}

// Keep aligned with `appwinSdkVersion` in
// `sdk/android-build/gradle.properties`.
ext.appwinSdkVersion = "0.4.0"

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.appwin.flutter.support"
    compileSdk = 35

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

dependencies {
    implementation "io.appwin:appwin-support:$appwinSdkVersion"
}
