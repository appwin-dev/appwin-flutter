name: appwin_notifications
description: "Push notifications and in-app messages for Flutter apps: token registration, campaigns and automations driven from the Appwin dashboard."
version: 1.1.0
homepage: https://appwin.io
repository: https://github.com/appwin-dev/appwin-flutter/tree/main/appwin_notifications
issue_tracker: https://github.com/appwin-dev/appwin-flutter/issues
topics:
  - appwin
  - push-notifications
  - in-app-messaging
  - notifications
  - engagement

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

  # The foundation, like `firebase_core` for the Firebase packages: the studio
  # installs a product and gets the single `configure` with it, without needing
  # to know this package exists.
  appwin_core: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppwinNotificationsPlugin
      android:
        package: io.appwin.flutter.notifications
        pluginClass: AppwinNotificationsPlugin
